MOD_ALAMARTE_ADMINMENU_CORE="Alamarte Admin Menu Core"
MOD_ALAMARTE_ADMINMENU_CORE_XML_DESCRIPTION="Fast and accessible quick-access menu for the Joomla! administrator area, with configurable Joomla! shortcuts, light/dark theme controls, temporary language switching, fixed Joomla-based styling, adjustable panel width, and up to three custom links."
MOD_ALAMARTE_ADMINMENU_CORE_DESCRIPTION_OVERVIEW_LABEL="What does Alamarte Admin Menu Core do?"
MOD_ALAMARTE_ADMINMENU_CORE_DESCRIPTION_OVERVIEW_DESCRIPTION="Alamarte Admin Menu Core adds a quick-access dropdown to the Joomla! administrator top bar. From one panel you can open frequently used content, administration, extension-management, update, and custom destinations without repeatedly navigating the main administrator menu."
MOD_ALAMARTE_ADMINMENU_CORE_DESCRIPTION_FEATURES_DESCRIPTION="<ul><li>Complete grouped Joomla! shortcuts for content, administration, languages, privacy, extensions, and updates.</li><li>Each Joomla! shortcut can be shown or hidden independently and remains filtered by Joomla ACL permissions.</li><li>Auto, Light, and Dark theme selector, including the option to show or hide its visible title.</li><li>Temporary selector between two installed administrator languages.</li><li>Fixed Joomla-based Core visual preset: Light uses the native blue administrator dropdown palette and Dark uses a distinct graphite palette. Core provides Compact, Standard, and Wide panel widths; Custom width and advanced color controls are shown disabled as Pro-version features.</li><li>Optional section headings for Content, Administration, Joomla! Extensions, and Custom Links.</li><li>Up to three custom links, each with a title and either a predefined administrator destination or a validated manual administrator URL.</li><li>Core custom links use the standard link icon and open in the current administrator window; the icon picker and new-window target are shown disabled as Pro features.</li><li>Keyboard support, responsive columns, ACL filtering, and server-side validation.</li></ul>"
MOD_ALAMARTE_ADMINMENU_CORE_DESCRIPTION_OPERATION_DESCRIPTION="On a new installation, the module is published in the status position and assigned to all administrator pages. Core provides the shared theme, heading-visibility, Joomla! Link, language-selector, and panel-width controls, but uses a fixed Joomla-based visual preset. Saved Pro colour and preset parameters remain stored and are ignored while Core is installed. Core limits custom links to the first three stored rows, uses the standard link icon, opens them in the current administrator window, and always uses the standard Admin Menu trigger label. Updates preserve the module instance, publication state, assignments, and saved parameters."
MOD_ALAMARTE_ADMINMENU_CORE_INSTRUCTIONS_FIRST_STEPS_DESCRIPTION="<ol><li>Open <strong>System → Manage → Administrator Modules</strong> and select <strong>Alamarte Admin Menu Core</strong>.</li><li>On the <strong>Module</strong> tab, confirm that the status is <strong>Published</strong>, the position is <strong>status</strong>, and the assignment includes the administrator pages where the menu should appear.</li><li>Under <strong>Theme</strong>, configure the Auto, Light, and Dark selector and its default theme.</li><li>Under <strong>Languages</strong>, select the two administrator languages and configure the temporary language selector.</li><li>Under <strong>Styles</strong>, review the fixed Joomla! visual preset and choose the panel width.</li><li>Open <strong>Joomla! Links</strong> and enable only the content, administration, language, privacy, extension, and update shortcuts required for this site. Section headings can also be shown or hidden.</li><li>Save the changes and refresh the administrator page to check the menu in the top bar.</li></ol>"
MOD_ALAMARTE_ADMINMENU_CORE_INSTRUCTIONS_CUSTOM_LINKS_DESCRIPTION="<ol><li>Open <strong>Custom Links</strong> and enable <strong>Enable Custom Links</strong>.</li><li>Core displays and uses up to three custom-link rows. Pro supports up to 50. Additional rows previously saved by Pro remain stored but hidden and unused while Core is installed.</li><li>Use <strong>Show Heading</strong> and <strong>Custom Section Title</strong> if you want to adjust the custom-links heading.</li><li>Enter a clear title for each link.</li><li>Choose the <strong>Link Source</strong>: <strong>Predefined</strong> displays the administrator menu-item selector; <strong>Manual</strong> displays the custom URL field.</li><li>Only the field that belongs to the selected source is used. Manual addresses are checked in real time and validated again by Joomla when saving.</li><li>Core uses the standard link icon and opens custom links in the current administrator window. The icon picker and new-window option are shown disabled to identify them as Pro-version features.</li></ol>"
MOD_ALAMARTE_ADMINMENU_CORE_ABOUT_INSTALLER_DESCRIPTION="<div style='font-weight:normal;color:#252671;width:100%;box-sizing:border-box'><div style='display:flex;flex-wrap:wrap;align-items:center;gap:18px;background:#fefefe;border:1px solid #dfe7f3;border-radius:8px;padding:18px'><img src='/media/mod_alamarte_adminmenu/adminmenu-logo.png' alt='Alamarte Admin Menu Core' style='display:block;width:100%;max-width:340px;height:auto;flex:0 1 340px'><div style='flex:1;min-width:260px'><h3 style='margin:0 0 8px'>Alamarte Admin Menu Core</h3><p style='margin:0;line-height:1.55'>A fast, accessible menu for the Joomla! administrator area with configurable Joomla! shortcuts, light/dark theme controls, temporary language switching, fixed Joomla-based styling, adjustable panel width, and up to three custom links.</p><p style='margin:8px 0 0;line-height:1.55'>Updates preserve the module instance, publication state, assignments, and compatible saved parameters.</p></div></div><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:14px'><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Module version</strong><br>1.4.1</div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Compatibility</strong><br>Joomla! 5 and Joomla! 6<br>PHP 8.1 or later</div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Developed by</strong><br><a href='https://alamarte.com' target='_blank' rel='noopener noreferrer'>Alamarte Ingeniería Web</a></div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>License</strong><br><a href='https://www.gnu.org/licenses/gpl-3.0.html' target='_blank' rel='noopener noreferrer'>GNU GPL version 3 or later</a></div></div><div style='font-weight:normal;background:#fefefe;color:#252671;padding:20px;text-align:center;border:1px solid #dfe7f3;border-radius:8px;margin-top:14px'><strong>Thank you for installing this extension!</strong><br><strong>Review us on:&nbsp;</strong><a href='https://www.trustpilot.com/evaluate/alamarte.com' title='Review us on Trustpilot' target='_blank' rel='noopener noreferrer'><img src='https://alamarte.com/images/logos/trustpilot-tra.png' width='154' height='40' alt='Trustpilot' style='vertical-align:middle'></a></div><p style='margin:14px 0 0'><small>© Alamarte Ingeniería Web, 2026 · <a href='https://alamarte.com' target='_blank' rel='noopener noreferrer'>Visit Alamarte</a></small></p></div>"


