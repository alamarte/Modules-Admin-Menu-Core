MOD_ALAMARTE_ADMINMENU_CORE="Alamarte Admin Menu Core"
MOD_ALAMARTE_ADMINMENU_CORE_XML_DESCRIPTION="<div style='font-weight:normal;color:#252671;width:100%;box-sizing:border-box'><div style='display:flex;flex-wrap:wrap;align-items:center;gap:18px;background:#fefefe;border:1px solid #dfe7f3;border-radius:8px;padding:18px'><img src='/media/mod_alamarte_adminmenu/adminmenu-logo.png' alt='Alamarte Admin Menu Core' style='display:block;width:100%;max-width:340px;height:auto;flex:0 1 340px'><div style='flex:1;min-width:260px'><h3 style='margin:0 0 8px'>Alamarte Admin Menu Core</h3><p style='margin:0;line-height:1.55'>A fast, accessible menu for the Joomla! administrator area with configurable Joomla! shortcuts, light/dark theme controls, temporary language switching, fixed Joomla-based styling, adjustable panel width, and up to three custom links.</p><p style='margin:8px 0 0;line-height:1.55'>Updates preserve the module instance, publication state, assignments, and compatible saved parameters.</p></div></div><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:14px'><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Module version</strong><br>1.4.1</div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Compatibility</strong><br>Joomla! 5 and Joomla! 6<br>PHP 8.1 or later</div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Developed by</strong><br><a href='https://alamarte.com' target='_blank' rel='noopener noreferrer'>Alamarte Ingeniería Web</a></div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>License</strong><br><a href='https://www.gnu.org/licenses/gpl-3.0.html' target='_blank' rel='noopener noreferrer'>GNU GPL version 3 or later</a></div></div></div>"
MOD_ALAMARTE_ADMINMENU_CORE_DEFAULT_MODULE_TITLE="Alamarte Admin Menu Core"


