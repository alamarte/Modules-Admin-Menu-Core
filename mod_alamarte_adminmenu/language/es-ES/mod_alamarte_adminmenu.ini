MOD_ALAMARTE_ADMINMENU_DEFAULT_THEME_AUTO_NOTE="<strong>Auto:</strong> adapta automáticamente el menú al modo claro u oscuro activo en el administrador de Joomla!. Este modo se controla desde <strong>Menú de usuario → Modo claro/oscuro</strong>. Si cambia el modo de Joomla!, el menú se adapta automáticamente."
