MOD_ALAMARTE_ADMINMENU_PANEL_WIDTH_COMPACT_NOTE="<strong>Compacto:</strong> limita el panel a un ancho máximo de <strong>760 px</strong>. Es útil para menús cortos o cuando prefiere un panel más estrecho. En pantallas pequeñas, el panel utiliza automáticamente el espacio disponible."
MOD_ALAMARTE_ADMINMENU_PANEL_WIDTH_STANDARD_NOTE="<strong>Estándar:</strong> utiliza un ancho máximo de <strong>900 px</strong>. Es la opción recomendada para la mayoría de configuraciones porque equilibra la capacidad del menú y la facilidad de lectura. En pantallas pequeñas, el panel utiliza automáticamente el espacio disponible."
MOD_ALAMARTE_ADMINMENU_PANEL_WIDTH_WIDE_NOTE="<strong>Amplio:</strong> utiliza un ancho máximo de <strong>1120 px</strong>. Es útil cuando el menú contiene muchos enlaces o títulos largos y necesita más espacio horizontal. En pantallas pequeñas, el panel utiliza automáticamente el espacio disponible."
MOD_ALAMARTE_ADMINMENU_CORE_PANEL_WIDTH_CUSTOM_PRO_NOTE="<strong>Solo disponible en la versión Pro.</strong><br>El ancho Personalizado permite definir un ancho máximo exacto entre <strong>640 y 1600 px</strong>. En Core, seleccione Compacto, Estándar o Amplio para guardar el ancho del panel."
MOD_ALAMARTE_ADMINMENU_PANEL_WIDTH_CUSTOM_NOTE="<strong>Personalizado:</strong> permite definir un ancho máximo exacto entre <strong>640 y 1600 px</strong>. Introduzca el valor en el campo que aparece debajo. En pantallas pequeñas, el panel nunca supera el espacio disponible."
MOD_ALAMARTE_ADMINMENU_CUSTOM_PANEL_WIDTH="Ancho personalizado (px)"
MOD_ALAMARTE_ADMINMENU_CUSTOM_PANEL_WIDTH_DESCRIPTION="Introduzca un ancho máximo entre 640 y 1600 píxeles. En pantallas pequeñas se seguirá utilizando el espacio disponible."
