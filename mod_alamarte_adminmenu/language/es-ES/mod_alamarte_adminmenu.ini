MOD_ALAMARTE_ADMINMENU_CORE_STYLE_PRESET_PRO="Preajuste visual (Versión Pro)"
MOD_ALAMARTE_ADMINMENU_CORE_STYLE_PRESET_PRO_DESCRIPTION="<strong>Core:</strong> utiliza siempre <strong>Administrador de Joomla! (Recomendado)</strong>. La versión Pro permite seleccionar <strong>Personalizado</strong> y configurar los colores del menú. Los valores Pro guardados previamente se conservan, pero Core no los aplica."
MOD_ALAMARTE_ADMINMENU_CORE_STYLE_PRESET_INFO="<strong>Preajuste visual</strong><br>En Alamarte Admin Menu Core se utiliza el preajuste <strong>Administrador de Joomla!</strong>, diseñado para integrarse con los colores y estilos del panel de administración. La versión Pro permite seleccionar otros preajustes y personalizar los colores del menú."
