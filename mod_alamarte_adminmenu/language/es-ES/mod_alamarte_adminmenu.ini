; Estilos
MOD_ALAMARTE_ADMINMENU_FIELDSET_STYLES_LABEL="Estilos"
MOD_ALAMARTE_ADMINMENU_FIELDSET_STYLES_DESCRIPTION="Core utiliza un preajuste visual fijo basado en Joomla!. Puede elegir los anchos Compacto, Estándar o Amplio. Las opciones avanzadas de estilo y el ancho Personalizado de Pro se muestran deshabilitados para que el usuario pueda identificar claramente qué funciones añade esa versión."
MOD_ALAMARTE_ADMINMENU_CORE_STYLE_PRESET_LABEL="Preajuste visual"
MOD_ALAMARTE_ADMINMENU_CORE_STYLE_PRESET_DESCRIPTION="<strong>Administrador de Joomla!</strong><br>En modo Claro, Core utiliza la paleta azul nativa de los menús desplegables del administrador de Joomla!. En modo Oscuro aplica una apariencia grafito diferenciada. Los controles avanzados de estilo de Pro se muestran debajo deshabilitados para que el usuario pueda identificar las funciones adicionales; cualquier valor guardado previamente por Pro se conserva, pero Core no lo aplica."
MOD_ALAMARTE_ADMINMENU_STYLE_PRESET="Preajuste visual"
MOD_ALAMARTE_ADMINMENU_STYLE_PRESET_DESCRIPTION="Utilice la paleta nativa del administrador de Joomla! o defina los siete colores del menú que aparecen debajo."
