MOD_ALAMARTE_ADMINMENU_CORE="Alamarte Admin Menu Core"
MOD_ALAMARTE_ADMINMENU_CORE_XML_DESCRIPTION="Menú rápido y accesible para el área de administración de Joomla!, con accesos configurables de Joomla!, controles de tema claro/oscuro, cambio temporal de idioma, estilo fijo basado en Joomla!, ancho de panel ajustable y hasta tres enlaces personalizados."
MOD_ALAMARTE_ADMINMENU_CORE_DESCRIPTION_OVERVIEW_LABEL="¿Qué hace Alamarte Admin Menu Core?"
MOD_ALAMARTE_ADMINMENU_CORE_DESCRIPTION_OVERVIEW_DESCRIPTION="Alamarte Admin Menu Core añade a la barra superior del área de administración de Joomla! un menú desplegable de acceso rápido. Desde un único panel permite abrir las tareas más utilizadas de contenido, administración, gestión de extensiones, actualizaciones y destinos personalizados sin recorrer repetidamente el menú principal."
MOD_ALAMARTE_ADMINMENU_CORE_DESCRIPTION_FEATURES_DESCRIPTION="<ul><li>Lista completa y agrupada de accesos de Joomla! para contenido, administración, idiomas, privacidad, extensiones y actualizaciones.</li><li>Cada acceso de Joomla! puede mostrarse u ocultarse de forma independiente y permanece filtrado por los permisos ACL de Joomla.</li><li>Selector de tema Auto, Claro y Oscuro, incluida la opción de mostrar u ocultar su título visible.</li><li>Selector temporal entre dos idiomas instalados para el administrador.</li><li>Preajuste visual fijo de Core basado en Joomla!: Claro utiliza la paleta azul nativa de los menús desplegables del administrador y Oscuro utiliza una paleta grafito diferenciada. Core permite anchos Compacto, Estándar y Amplio; el ancho Personalizado y los controles avanzados de color se muestran deshabilitados como funciones de la versión Pro.</li><li>Encabezados de sección opcionales para Contenido, Administración, Extensiones de Joomla! y Enlaces personalizados.</li><li>Hasta tres enlaces personalizados, cada uno con título y un destino predefinido del administrador o una URL manual validada.</li><li>En Core, los enlaces personalizados utilizan el icono estándar de enlace y se abren en la ventana actual del administrador; el selector de iconos y la apertura en ventana nueva se muestran deshabilitados como funciones Pro.</li><li>Navegación mediante teclado, columnas adaptables, filtrado ACL y validación en el servidor.</li></ul>"
MOD_ALAMARTE_ADMINMENU_CORE_DESCRIPTION_OPERATION_DESCRIPTION="En una instalación nueva, el módulo se publica en la posición status y se asigna a todas las páginas del administrador. Core conserva los controles compartidos de tema, visibilidad de encabezados, Enlaces Joomla!, selector de idioma y ancho del panel, pero utiliza un preajuste visual fijo basado en Joomla!. Los parámetros de colores y preajuste guardados por Pro permanecen almacenados y Core los ignora. Core limita los enlaces personalizados a las tres primeras filas guardadas, utiliza el icono estándar de enlace, los abre en la ventana actual del administrador y usa siempre la etiqueta estándar Menú Admin. Las actualizaciones conservan la instancia del módulo, el estado de publicación, las asignaciones y los parámetros guardados."
MOD_ALAMARTE_ADMINMENU_CORE_INSTRUCTIONS_FIRST_STEPS_DESCRIPTION="<ol><li>Abra <strong>Sistema → Gestionar → Módulos del administrador</strong> y seleccione <strong>Alamarte Admin Menu Core</strong>.</li><li>En la pestaña <strong>Módulo</strong>, compruebe que el estado sea <strong>Publicado</strong>, la posición sea <strong>status</strong> y la asignación incluya las páginas del administrador donde desea mostrarlo.</li><li>En <strong>Tema</strong>, configure el selector Auto, Claro y Oscuro y su tema predeterminado.</li><li>En <strong>Idiomas</strong>, seleccione los dos idiomas del administrador y configure el selector temporal.</li><li>En <strong>Estilos</strong>, revise el preajuste visual fijo de Joomla! y elija el ancho del panel.</li><li>Abra <strong>Enlaces Joomla!</strong> y active únicamente los accesos de contenido, administración, idiomas, privacidad, extensiones y actualizaciones necesarios para este sitio. También puede mostrar u ocultar los encabezados de sección.</li><li>Guarde los cambios y actualice la página del administrador para comprobar el menú en la barra superior.</li></ol>"
MOD_ALAMARTE_ADMINMENU_CORE_INSTRUCTIONS_CUSTOM_LINKS_DESCRIPTION="<ol><li>Abra <strong>Enlaces personalizados</strong> y active <strong>Habilitar los enlaces personalizados</strong>.</li><li>Core muestra y utiliza hasta tres filas de enlaces personalizados. Pro admite hasta 50. Las filas adicionales guardadas previamente por Pro permanecen almacenadas, pero ocultas y sin uso mientras Core esté instalado.</li><li>Use <strong>Mostrar encabezado</strong> y <strong>Título de la sección personalizada</strong> si desea ajustar el encabezado de los enlaces personalizados.</li><li>Escriba un título claro para cada enlace.</li><li>Elija la <strong>Fuente del enlace</strong>: <strong>Predefinido</strong> muestra el selector de elementos del menú del administrador; <strong>Manual</strong> muestra el campo URL personalizada.</li><li>Solo se utiliza el campo correspondiente a la fuente seleccionada. Las direcciones manuales se comprueban en tiempo real y Joomla vuelve a validarlas al guardar.</li><li>Core utiliza el icono estándar de enlace y abre los enlaces personalizados en la ventana actual. El selector de iconos y la opción de abrir en una ventana nueva se muestran deshabilitados para indicar que pertenecen a la versión Pro.</li></ol>"
MOD_ALAMARTE_ADMINMENU_CORE_ABOUT_INSTALLER_DESCRIPTION="<div style='font-weight:normal;color:#252671;width:100%;box-sizing:border-box'><div style='display:flex;flex-wrap:wrap;align-items:center;gap:18px;background:#fefefe;border:1px solid #dfe7f3;border-radius:8px;padding:18px'><img src='/media/mod_alamarte_adminmenu/adminmenu-logo.png' alt='Alamarte Admin Menu Core' style='display:block;width:100%;max-width:340px;height:auto;flex:0 1 340px'><div style='flex:1;min-width:260px'><h3 style='margin:0 0 8px'>Alamarte Admin Menu Core</h3><p style='margin:0;line-height:1.55'>Menú rápido y accesible para el área de administración de Joomla!, con accesos configurables de Joomla!, controles de tema claro/oscuro, cambio temporal de idioma, estilo fijo basado en Joomla!, ancho de panel ajustable y hasta tres enlaces personalizados.</p><p style='margin:8px 0 0;line-height:1.55'>Durante las actualizaciones conserva la instancia del módulo, el estado de publicación, las asignaciones y los parámetros compatibles guardados.</p></div></div><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:14px'><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Versión del módulo</strong><br>1.4.1</div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Compatibilidad</strong><br>Joomla! 5 y Joomla! 6<br>PHP 8.1 o posterior</div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Desarrollado por</strong><br><a href='https://alamarte.com' target='_blank' rel='noopener noreferrer'>Alamarte Ingeniería Web</a></div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Licencia</strong><br><a href='https://www.gnu.org/licenses/gpl-3.0.html' target='_blank' rel='noopener noreferrer'>GNU GPL versión 3 o posterior</a></div></div><div style='font-weight:normal;background:#fefefe;color:#252671;padding:20px;text-align:center;border:1px solid #dfe7f3;border-radius:8px;margin-top:14px'><strong>¡Gracias por instalar esta extensión!</strong><br><strong>Califíquenos en:&nbsp;</strong><a href='https://www.trustpilot.com/evaluate/alamarte.com' title='Califíquenos en Trustpilot' target='_blank' rel='noopener noreferrer'><img src='https://alamarte.com/images/logos/trustpilot-tra.png' width='154' height='40' alt='Trustpilot' style='vertical-align:middle'></a></div><p style='margin:14px 0 0'><small>© Alamarte Ingeniería Web, 2026 · <a href='https://alamarte.com' target='_blank' rel='noopener noreferrer'>Visitar Alamarte</a></small></p></div>"


