MOD_ALAMARTE_ADMINMENU_CORE="Alamarte Admin Menu Core"
MOD_ALAMARTE_ADMINMENU_CORE_XML_DESCRIPTION="<div style='font-weight:normal;color:#252671;width:100%;box-sizing:border-box'><div style='display:flex;flex-wrap:wrap;align-items:center;gap:18px;background:#fefefe;border:1px solid #dfe7f3;border-radius:8px;padding:18px'><img src='/media/mod_alamarte_adminmenu/adminmenu-logo.png' alt='Alamarte Admin Menu Core' style='display:block;width:100%;max-width:340px;height:auto;flex:0 1 340px'><div style='flex:1;min-width:260px'><h3 style='margin:0 0 8px'>Alamarte Admin Menu Core</h3><p style='margin:0;line-height:1.55'>Menú rápido y accesible para el área de administración de Joomla!, con accesos configurables de Joomla!, controles de tema claro/oscuro, cambio temporal de idioma, estilo fijo basado en Joomla!, ancho de panel ajustable y hasta tres enlaces personalizados.</p><p style='margin:8px 0 0;line-height:1.55'>Durante las actualizaciones conserva la instancia del módulo, el estado de publicación, las asignaciones y los parámetros compatibles guardados.</p></div></div><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:14px'><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Versión del módulo</strong><br>1.4.1</div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Compatibilidad</strong><br>Joomla! 5 y Joomla! 6<br>PHP 8.1 o posterior</div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Desarrollado por</strong><br><a href='https://alamarte.com' target='_blank' rel='noopener noreferrer'>Alamarte Ingeniería Web</a></div><div style='background:#f5f7fb;border:1px solid #dfe7f3;border-radius:7px;padding:12px'><strong>Licencia</strong><br><a href='https://www.gnu.org/licenses/gpl-3.0.html' target='_blank' rel='noopener noreferrer'>GNU GPL versión 3 o posterior</a></div></div></div>"
